<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ROB 511 Portfolio</title>
<style>
  :root { --bg: #faf8f5; --ink: #1d1d1f; --muted: #5f5f66; --rule: #e4e0d9; --accent: #c2410c; --card: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --ink: #ececef; --muted: #a3a3ab; --rule: #2e2e33; --accent: #fb923c; --card: #1f1f23; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 2.1rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--card);
           border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
  a.card:hover { border-color: var(--accent); }
  .card b { color: var(--accent); }
  .card span { display: block; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>ROB 511 Portfolio</h1>
  <p class="sub">Saima Jamal · Fall 2026</p>
  <a class="card" href="project3/"><b>Project 3: Fetch dances</b>
    <span>Forward kinematics from a real URDF, and an FSM choreography for the Fetch robot.</span></a>
</main>
</body>
</html>
